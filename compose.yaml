name: ab-ignite-local

services:
  api:
    image: ab-ignite-backend:production
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ./.env
        required: true
    environment:
      DATABASE_URL: /app/data/ab-ignite.db
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4100
    volumes:
      - sqlite_data:/app/data
    expose:
      - "4100"
    networks:
      api_private:
        ipv4_address: 172.30.0.3
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "docker/healthcheck.mjs", "api"]
      interval: 15s
      timeout: 6s
      start_period: 20s
      retries: 4

volumes:
  sqlite_data:
    name: ab-ignite-local_sqlite_data

networks:
  api_private:
    name: ab-ignite-local_api_private
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
